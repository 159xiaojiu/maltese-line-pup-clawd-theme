    <path d="M 2.5,5 C 1,6 0.5,8.5 1.5,10.5 C 2,11.5 3,12 4,11.5 C 3,9.5 3,7 2.5,5 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.9" stroke-linejoin="round"/>
